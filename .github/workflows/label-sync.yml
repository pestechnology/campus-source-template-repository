name: Label Sync

on:
  push:
    branches: [ main ]
    paths:
      - '.github/labels.yml'

jobs:
  sync:
    name: Sync GitHub Labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Labels
        uses: Mic92/github-labeler@v1
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          config: .github/labels.yml
