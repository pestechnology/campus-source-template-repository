name: 'Stale Issue/PR Manager'
on:
  schedule:
    - cron: '30 1 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been inactive for 30 days. It will be closed in 7 days to keep our queue fresh for new students. If you still want to work on this, just leave a comment! Need help? Join our [Discord](https://discord.gg/yourlink).'
          stale-pr-message: 'This PR has been inactive for 14 days. We know students are busy with exams/classes! If you are stuck or need help finishing this, please let us know or ping us on Discord. Otherwise, we will close this soon to allow someone else to take it up.'
          days-before-stale: 30
          days-before-pr-stale: 14
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
