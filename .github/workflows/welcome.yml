name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
    - name: Welcome New Contributor
      uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome to Campus Source! 🎓 Thank you for opening your first issue. Our team will review it shortly. In the meantime, feel free to join our [Discord](https://discord.gg/yourlink)!"
        pr-message: "Welcome to Campus Source! 🚀 Thank you for your first Pull Request. We are excited to see your contribution! Our maintainers will review your code as soon as possible."
