# Minimalist Labeler configuration for v5

documentation:
  - any: ['docs/**/*', '*.md']

frontend:
  - any: ['src/ui/**/*', 'src/components/**/*', 'src/styles/**/*']

backend:
  - any: ['src/api/**/*', 'src/db/**/*', 'src/services/**/*']

tests:
  - any: ['tests/**/*', '**/*.test.js', '**/*.spec.js']
